[package]
name = "merl-live-delivery-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[lib]
path = "src/delivery.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = "1.26.0"

[dev-dependencies]
tempfile = "3.21"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"


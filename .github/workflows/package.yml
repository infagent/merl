name: Package

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ inputs.sha }}
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Validate version and frozen source
        shell: bash
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python3 scripts/release.py check --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --require-tag
          else
            RELEASE_TAG="v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
            RELEASE_SHA=$(git rev-parse HEAD)
            python3 scripts/release.py check --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
          fi
          printf 'RELEASE_TAG=%s\nRELEASE_SHA=%s\n' "$RELEASE_TAG" "$RELEASE_SHA" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Build native release binary
        run: cargo build --locked --release --bin merl --target "$BUILD_TARGET"

      - name: Package binary, matching skill and license
        run: |
          python3 scripts/release.py package --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" \
            --target "$BUILD_TARGET" --binary "target/$BUILD_TARGET/release/merl" --output packages

      - name: Verify clean user-directory installation
        run: |
          python3 scripts/smoke_package.py --tag "$RELEASE_TAG" \
            --archive "packages/merl-$RELEASE_TAG-$BUILD_TARGET.tar.gz"

      - name: Preserve native archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merl-${{ matrix.target }}
          path: packages/*.tar.gz
          if-no-files-found: error
          retention-days: 7

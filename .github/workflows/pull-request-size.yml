name: Pull request size

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  size:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # This event has a write-capable token, so only trusted default-branch
      # configuration may enter the workspace. Pull-request code never runs.
      - name: Check out trusted configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Apply pull request size label
        uses: docker://ghcr.io/cbrgm/pr-size-labeler-action@sha256:bc51f8ade7b3a1d2ab6fe5976f0119ebf3212e5fa5ea3c4d34ec7876057d9f44
        env:
          CONFIG_FILE_PATH: .github/pull-request-size.yml
          GITHUB_EVENT_NAME: pull_request_target
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}

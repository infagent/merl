name: Release Please

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Create or publish release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create release automation token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.INFAGENT_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFAGENT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dry-run:
    name: Validate release configuration
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create release automation token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.INFAGENT_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFAGENT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Run Release Please without changes
        env:
          RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          npx --yes release-please@17.6.0 release-pr \
            --dry-run \
            --token="${RELEASE_TOKEN}" \
            --repo-url="${GITHUB_REPOSITORY}" \
            --target-branch="${{ github.event.repository.default_branch }}" \
            --config-file=release-please-config.json \
            --manifest-file=.release-please-manifest.json

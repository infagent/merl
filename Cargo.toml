[workspace]
resolver = "3"
members = ["crates/merl-corpus", "crates/merl-core", "crates/merl-store", "crates/merl-cli", "crates/merl-ingest"]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/infagent/merl"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[package]
name = "merl"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Shared, provenance-backed project state for agent teams"
license = "MIT"
repository = "https://github.com/infagent/merl"
publish = false

[dependencies]
merl-cli = { path = "crates/merl-cli" }

[dev-dependencies]
merl-corpus = { path = "crates/merl-corpus" }
serde_json.workspace = true
merl-core = { path = "crates/merl-core" }
merl-store = { path = "crates/merl-store" }
merl-ingest = { path = "crates/merl-ingest" }
sha2.workspace = true

[lints]
workspace = true

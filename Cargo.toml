[workspace]
resolver = "3"
members = ["crates/merl-mail", "crates/merl-cli", "crates/merl-lane", "crates/merl-setup"]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/infagent/merl"

[workspace.dependencies]
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[package]
name = "merl"
version = "0.3.0"
edition = "2024"
rust-version = "1.98.1"
description = "Durable local agent messaging with existing-session wake"
license = "MIT"
repository = "https://github.com/infagent/merl"
publish = false

[dependencies]
merl-cli = { path = "crates/merl-cli" }

[dev-dependencies]
merl-setup = { path = "crates/merl-setup" }
merl-lane = { path = "crates/merl-lane" }
merl-mail = { path = "crates/merl-mail" }
serde_json.workspace = true

[lints]
workspace = true

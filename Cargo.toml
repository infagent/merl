[workspace]
resolver = "3"
members = ["crates/corpus"]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/infagent/merl"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = { version = "0.3.55", default-features = false, features = ["parsing"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[package]
name = "merl"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Shared, provenance-backed project state for agent teams"
license = "MIT"
repository = "https://github.com/infagent/merl"
publish = false

[dev-dependencies]
corpus = { path = "crates/corpus" }
serde_json.workspace = true

[lints]
workspace = true
